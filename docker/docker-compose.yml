services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: telecom
      POSTGRES_DB: telecom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/01_schemas.sql:/docker-entrypoint-initdb.d/01_schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telecom"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      TI_DATABASE_URL: postgresql+psycopg://postgres:telecom@db:5432/telecom
      TI_JWT_SECRET: dev-secret
      TI_DEMO_USERNAME: demo
      TI_DEMO_PASSWORD: demo123
      TI_LLM_API_KEY: ""
      TI_PACKS_ROOT: /app/packs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
