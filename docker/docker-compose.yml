services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: telecom
      POSTGRES_DB: telecom
    ports:
      # Host 5433 avoids local Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/01_schemas.sql:/docker-entrypoint-initdb.d/01_schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telecom"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      TI_DATABASE_URL: postgresql+psycopg://postgres:telecom@db:5432/telecom
      TI_JWT_SECRET: dev-secret
      TI_DEMO_USERNAME: demo
      TI_DEMO_PASSWORD: demo123
      TI_LLM_API_KEY: ""
      TI_PACKS_ROOT: /app/packs
      TI_BRANDING_DATA_DIR: /app/data/branding
    volumes:
      - branding_data:/app/data/branding
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Host port 8080 → container 80 (use 5173:80 if 8080 is taken)
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  branding_data: